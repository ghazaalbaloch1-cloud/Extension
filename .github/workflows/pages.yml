name: Deploy CMS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          set -e
          test -f frontend/index.html
          test -f frontend/styles.css
          test -f frontend/app.js
          test -f frontend/config.js
          test -f frontend/bridge-fixes.js
          rm -rf _site
          mkdir -p _site
          cp -v frontend/index.html frontend/styles.css frontend/app.js frontend/config.js frontend/bridge-fixes.js _site/
          test -f _site/index.html
          echo "Prepared GitHub Pages site:"
          find _site -maxdepth 1 -type f -printf '%f\n' | sort
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
