name: Validate Extension

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Validate Worker JavaScript
        run: node --check worker/src/index.v2.js
      - name: Validate CMS JavaScript
        run: node --check frontend/app.js
      - name: Validate required frontend files
        run: test -f frontend/index.html && test -f frontend/styles.css && test -f frontend/config.js
